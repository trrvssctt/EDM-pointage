# Nginx : accès au pointage biométrique (les ports 80 / 443 / 8090 sont déjà utilisés par les autres sites).
#   http://185.215.165.43:8095   bornes de pointage et application mobile
#   https://185.215.165.43:8443  administration web : HTTPS obligatoire pour la caméra (enrôlement)
#                                certificat auto-signé généré par installer_vps.sh (à remplacer par
#                                Let's Encrypt dès qu'un nom de domaine est disponible, voir DEPLOIEMENT.md)

map $http_upgrade $edm_connexion { default upgrade; "" close; }

server {
    listen 8095;
    listen [::]:8095;
    server_name _;
    include /etc/nginx/snippets/edm-pointage-proxy.conf;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/edm-pointage.crt;
    ssl_certificate_key /etc/nginx/ssl/edm-pointage.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/edm-pointage-proxy.conf;
}
