# Nginx : accès public au pointage biométrique sur http://185.215.165.43:8095
# (les ports 80 / 443 / 8090 sont déjà utilisés par les autres sites du serveur).
server {
    listen 8095;
    listen [::]:8095;
    server_name _;

    # Enrôlement : 5 photos encodées dans la requête ; exports Excel / PDF.
    client_max_body_size 25m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # rapports et exports volumineux
    }
}
